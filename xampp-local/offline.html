<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1930">
  <title>KBR Office - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F4F6F9;
      color: #0A1930;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 420px); border-top: 4px solid #B8863B; padding-top: 28px; }
    h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #526070; font: 16px/1.6 Arial, sans-serif; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      background: #0A1930;
      color: #FFFFFF;
      font: 700 14px Arial, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Anda sedang offline</h1>
    <p>Sambungkan kembali perangkat ke internet untuk mengakses data terbaru dan masuk ke KBR Office.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
